<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio — Javier Kulemeyer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
  <div class="frame">
    <div class="name-plate">
      <h1 data-i18n="portfolioTitle">Portfolio</h1>
<p data-i18n="portfolioSubtitle">Trabajos, ilustración y proyectos</p>
    </div>

    <div class="gallery">
      <a class="card" href="#">
        <img src="assets/portfolio/Gatito.png" alt="Gatito">
        <span class="card-label">Gatito</span>
      </a>
     
      <a class="card" href="#">
        <img src="assets/portfolio/Rata.jpg" alt="Rata">
        <span class="card-label">Rata</span>
      </a>
      <a class="card" href="#">
        <img src="assets/portfolio/torre y ola.png" alt="torre y ola">
        <span class="card-label">Torre y Ola</span>
      </a>
      
       <a class="card" href="#">
        <img src="assets/portfolio/autoretrato.jpg" alt="autorretrato">
        <span class="card-label">Autoretrato</span>
      </a>
       <a class="card" href="#">
        <img src="assets/portfolio/8 en 1.jpg" alt="autorretrato">
        <span class="card-label">Gorditos</span>
      </a>
      <!-- Para agregar otro proyecto, copiá el bloque de arriba (de <a> a </a>)
           y cambiá el nombre del archivo y el texto -->
    </div>

    
    <a class="back" href="index.html" data-i18n="back">◂ volver al menú</a>
    </div>
    </div>

  <footer class="site-footer">
    <div class="lang-box">
      <p class="lang-phrase" data-i18n="footerPhrase">Este sitio está hecho con muy poco conocimiento sobre código, algo de inteligencia natural y bastante inteligencia artificial.</p>
    </div>
    <div class="lang-buttons">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="de">DE</button>
    </div>
  </footer>
     <script src="script.js"></script>
</body>
</html>
